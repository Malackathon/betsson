[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    -q
    --strict-markers

markers =
    unit: Pure unit tests without network or external services
    e2e: End-to-end integration and browser tests for Betsson validation
    slow: Long-running tests requiring live browser or AI model inference

